# Portables Windows-Paket bauen (ohne Installer, ohne Admin, ohne Code-Signing).
# Start: manuell (Actions -> "Windows-Paket" -> Run workflow) oder per Tag v*.
# Ergebnis: Artefakt "Uni-Hotspot-win-x64" (Download = ZIP) mit Ordner Uni-Hotspot-<version>-win-x64/Uni-Hotspot.exe.
# Enthält keine Modelle, kein whisper.cpp, kein ffmpeg (bleiben bestätigter Download in der App).
name: Windows-Paket

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      npm_config_fund: 'false'
      npm_config_audit: 'false'
    steps:
      - name: Quellcode
        uses: actions/checkout@v4

      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Abhängigkeiten (exakt nach package-lock.json)
        run: npm ci

      - name: Typecheck, Lint, Tests (Mock-Ollama)
        run: |
          npm run typecheck
          npm run lint
          npm test

      - name: Oberfläche bauen
        run: npm run build

      - name: Electron-Laufzeit für Windows laden
        run: node node_modules/electron/install.js

      - name: Paket zusammenstellen
        run: node scripts/package-win.mjs

      - name: Rauchtest – Paket startet ohne Admin (Mock-Ollama, eigener Datenordner)
        shell: pwsh
        run: |
          $env:HOTSPOT_SMOKE_TEST = '1'
          $env:HOTSPOT_MOCK_OLLAMA = '1'
          $env:HOTSPOT_DATA_DIR = Join-Path $env:RUNNER_TEMP 'uh-smoke-data'
          $exe = Get-ChildItem -Path out -Recurse -Filter 'Uni-Hotspot.exe' | Select-Object -First 1
          if (-not $exe) { throw 'Uni-Hotspot.exe fehlt im Paket' }
          $p = Start-Process -FilePath $exe.FullName -PassThru
          if (-not $p.WaitForExit(120000)) { Stop-Process -Id $p.Id -Force; throw 'Rauchtest: Zeitüberschreitung (120 s)' }
          if ($p.ExitCode -ne 0) { throw "Rauchtest fehlgeschlagen (Exit-Code $($p.ExitCode))" }
          if (-not (Test-Path (Join-Path $env:HOTSPOT_DATA_DIR 'hotspot.sqlite'))) { throw 'Rauchtest: keine Datenbank angelegt' }
          Write-Host 'Rauchtest ok'

      - name: Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Uni-Hotspot-win-x64
          path: out/
          if-no-files-found: error
          retention-days: 30
